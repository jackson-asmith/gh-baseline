name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Native egress firewall (technical preview): outbound traffic is limited
    # to the allow list in .github/egress-firewall.yaml. Needs contents: read
    # (set above) so the firewall can read that file.
    runs-on: ubuntu-24.04-firewall
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: smoke test the built binary
        run: |
          go build -o "$RUNNER_TEMP/gh-baseline" .
          bash .github/smoke-test.sh "$RUNNER_TEMP/gh-baseline"
